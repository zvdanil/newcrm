services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: iris_db
      POSTGRES_USER: iris_user
      POSTGRES_PASSWORD: ReplaceWithYourStrongDbPassword123!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris_user -d iris_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://iris_user:ReplaceWithYourStrongDbPassword123!@postgres:5432/iris_db
      JWT_SECRET: ReplaceWithRandomSecretStringAtLeast32CharsLong12345
      JWT_EXPIRES_IN: 7d
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backups:/app/backups
      - ./backups:/backups

volumes:
  postgres_data:
